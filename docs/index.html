<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RealCognix OS</title>
  <meta name="description" content="RealCognix OS — the real estate growth and sales operating system. Clickable prototype.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.ico">
  <script>
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('rc-theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      try { if (localStorage.getItem('rc-sb') === '1') document.documentElement.className += ' pre-collapsed'; } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="is-auth">

  <!-- Sign-in (rendered by screens/login.js) -->
  <div id="auth"></div>

  <!-- Application shell -->
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sb-head">
        <a href="#/dashboard" class="logo-full" aria-label="RealCognix OS home">
          <img class="logo-light" src="assets/img/RealCognix_Horizontal_FullColour.svg" alt="RealCognix">
          <img class="logo-dark" src="assets/img/RealCognix_Horizontal_Reverse.svg" alt="RealCognix">
        </a>
        <a href="#/dashboard" class="sb-mark" aria-label="Home"><img src="assets/img/favicon.svg" alt="" width="22" height="22"></a>
        <button class="icon-btn sb-collapse" id="sbCollapse" data-local title="Collapse sidebar" aria-label="Collapse sidebar"></button>
      </div>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-foot">
        <button class="sb-org" id="orgBtn" data-local>
          <span class="av navy">RC</span>
          <span class="meta"><b>RealCognix Agency</b><span>Bengaluru · 4 clients</span></span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn tb-menu" id="menuBtn" data-local aria-label="Open menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <button class="search-btn" id="searchBtn" data-local aria-label="Search">
          <span class="ic-search"></span><span>Search leads, projects, pages</span><kbd>⌘K</kbd>
        </button>
        <div class="tb-spacer"></div>
        <div class="tb-client">
          <select class="select inline tb-select" id="clientFilter" aria-label="Client filter"></select>
        </div>
        <button class="icon-btn" id="bellBtn" data-local aria-label="Notifications"></button>
        <button class="icon-btn" id="themeBtn" data-local aria-label="Toggle theme"></button>
        <button class="icon-btn" id="avatarBtn" data-local aria-label="Account"><span class="av sm navy">AR</span></button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Overlays -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true"></aside>
  <div class="popover" id="popover"></div>
  <div class="palette" id="palette"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/data-ops.js"></script>
  <script src="assets/js/screens/login.js"></script>
  <script src="assets/js/screens/dashboard.js"></script>
  <script src="assets/js/screens/clients.js"></script>
  <script src="assets/js/screens/projects.js"></script>
  <script src="assets/js/screens/microsites.js"></script>
  <script src="assets/js/screens/campaigns.js"></script>
  <script src="assets/js/screens/leads.js"></script>
  <script src="assets/js/screens/conversations.js"></script>
  <script src="assets/js/screens/ops1.js"></script>
  <script src="assets/js/screens/ops2.js"></script>
  <script>RC.start();</script>
</body>
</html>
